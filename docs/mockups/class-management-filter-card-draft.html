<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学管中心班级管理筛选与卡片草稿</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --panel-soft: #f9fbfd;
      --line: #dbe5ee;
      --line-strong: #b9c9d8;
      --text: #172033;
      --muted: #68778a;
      --soft: #eef4f9;
      --blue: #2563eb;
      --blue-soft: #eaf2ff;
      --green: #0f8a64;
      --amber: #a15c07;
      --danger: #c2410c;
      --shadow: 0 14px 36px rgba(29, 43, 67, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    button {
      font: inherit;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
    }

    .sidebar {
      background: #1d2735;
      color: #cdd7e4;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .nav-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
      position: relative;
      cursor: default;
    }

    .nav-icon.active {
      color: #ffffff;
      background: #2563eb;
    }

    .nav-icon:hover::after {
      content: attr(data-name);
      position: absolute;
      left: 52px;
      top: 50%;
      transform: translateY(-50%);
      white-space: nowrap;
      padding: 7px 10px;
      border-radius: 8px;
      background: #101827;
      color: #fff;
      font-size: 13px;
      box-shadow: var(--shadow);
      z-index: 20;
    }

    main {
      padding: 26px 30px 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 26px;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .role-switch {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }

    .role-switch button {
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      cursor: pointer;
    }

    .role-switch button.active {
      background: #1d2735;
      color: #fff;
    }

    .tabs {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
    }

    .tab {
      border: 0;
      background: transparent;
      padding: 12px 4px;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab.active {
      color: var(--blue);
      border-bottom-color: var(--blue);
    }

    .toolbar {
      position: relative;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 8px 22px rgba(29, 43, 67, 0.05);
    }

    .overview {
      position: relative;
      border: 1px solid #d7eaff;
      background: var(--panel);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 20px 42px rgba(37, 99, 235, 0.07);
    }

    .overview-kicker {
      margin: 0 0 14px;
      color: #0874d8;
      font-size: 14px;
      letter-spacing: 0.36em;
      text-transform: uppercase;
    }

    .overview-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      position: relative;
    }

    .overview-head h2 {
      margin: 0;
      font-size: 25px;
      letter-spacing: 0;
    }

    .info-mark {
      border: 0;
      background: transparent;
      color: #0b8ae8;
      height: 26px;
      width: 26px;
      display: grid;
      place-items: center;
      cursor: pointer;
      font-weight: 900;
    }

    .overview-filter-wrap {
      position: relative;
      margin-left: 2px;
    }

    .overview-filter-trigger {
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: #31435b;
      border-radius: 999px;
      min-height: 34px;
      padding: 7px 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 800;
    }

    .overview-filter-trigger.active,
    .overview-filter-trigger:hover {
      border-color: #8fb6ff;
      background: var(--blue-soft);
      color: #174ea6;
    }

    .overview-filter-trigger .x {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 0;
      background: rgba(37, 99, 235, 0.12);
      color: #174ea6;
      line-height: 18px;
      padding: 0;
      cursor: pointer;
    }

    .cascade {
      position: absolute;
      top: 42px;
      left: 0;
      z-index: 30;
      display: none;
      grid-template-columns: 1fr;
      gap: 10px;
      width: min(460px, calc(100vw - 90px));
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 18px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .cascade.open {
      display: grid;
    }

    .cascade-col {
      border: 1px solid var(--line);
      background: var(--panel-soft);
      border-radius: 14px;
      padding: 10px;
      min-height: 0;
    }

    .cascade-title {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .cascade-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cascade-options.vertical {
      display: grid;
    }

    .cascade-option {
      border: 1px solid var(--line);
      background: #fff;
      color: #30445f;
      border-radius: 999px;
      padding: 8px 11px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
    }

    .cascade-option.block {
      width: 100%;
      justify-content: flex-start;
      border-radius: 12px;
      text-align: left;
    }

    .cascade-option:hover,
    .cascade-option.active,
    .cascade-option.selected {
      border-color: #8fb6ff;
      background: var(--blue-soft);
      color: #174ea6;
    }

    .overview-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .stat-card {
      border: 1px solid #d7eaff;
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fcff 100%);
      padding: 17px 16px;
      min-height: 98px;
    }

    .stat-label {
      margin: 0;
      color: #93a4bc;
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .stat-value {
      margin: 14px 0 0;
      font-size: 30px;
      font-weight: 900;
      color: #172033;
    }

    .overview-summary {
      margin: -6px 0 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .filter-label {
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 12px;
      min-width: 104px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .filter-label.active,
    .filter-label.selected {
      border-color: #8fb6ff;
      background: var(--blue-soft);
      color: #174ea6;
    }

    .filter-label .x {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 0;
      background: rgba(37, 99, 235, 0.12);
      color: #174ea6;
      line-height: 18px;
      padding: 0;
      cursor: pointer;
    }

    .filter-meta {
      margin-left: auto;
      color: var(--muted);
      font-size: 13px;
    }

    .popover {
      margin-top: 12px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      box-shadow: var(--shadow);
    }

    .popover-title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .option-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .option {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      color: #2e3a4d;
      cursor: pointer;
    }

    .option:hover,
    .option.selected {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 14px 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .class-list {
      display: grid;
      gap: 10px;
    }

    .class-card {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(29, 43, 67, 0.045);
    }

    .class-head {
      display: grid;
      grid-template-columns: minmax(220px, 1.3fr) minmax(280px, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
    }

    .class-main h2 {
      margin: 0 0 6px;
      font-size: 17px;
      letter-spacing: 0;
    }

    .class-sub,
    .field-label {
      color: var(--muted);
      font-size: 13px;
    }

    .class-sub {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #a9b8c8;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .field-value {
      margin-top: 3px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-button,
    .text-button {
      border: 1px solid var(--line);
      background: #fff;
      color: #2f3d52;
      height: 34px;
      border-radius: 9px;
      cursor: pointer;
    }

    .icon-button {
      width: 34px;
      font-weight: 900;
    }

    .text-button {
      padding: 0 12px;
      font-weight: 700;
    }

    .text-button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .class-detail {
      display: none;
      border-top: 1px solid var(--line);
      background: #fbfdff;
      padding: 14px 16px 16px;
    }

    .class-card.open .class-detail {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 16px;
    }

    .detail-box {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 12px;
    }

    .detail-box h3 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .student-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .student-pills span {
      background: var(--soft);
      border-radius: 999px;
      padding: 6px 9px;
      color: #3a4a60;
      font-size: 13px;
    }

    .timeline {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
      font-size: 13px;
      color: #3a4a60;
    }

    .timeline strong {
      color: var(--text);
    }

    .kbd {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line-strong);
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 1px 6px;
      background: #fff;
      color: #344158;
      font-size: 12px;
      font-weight: 700;
    }

    .tag {
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 800;
    }

    .tag.green {
      background: #e7f8f0;
      color: var(--green);
    }

    .tag.amber {
      background: #fff3df;
      color: var(--amber);
    }

    .tag.blue {
      background: var(--blue-soft);
      color: #174ea6;
    }

    @media (max-width: 900px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      main {
        padding: 18px;
      }

      .topbar,
      .summary-line {
        align-items: stretch;
        flex-direction: column;
      }

      .class-head {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .class-card.open .class-detail {
        grid-template-columns: 1fr;
      }

      .field-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filter-meta {
        width: 100%;
        margin-left: 0;
      }

      .overview-stats,
      .cascade {
        grid-template-columns: 1fr;
      }

      .cascade {
        width: min(520px, calc(100vw - 48px));
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="收起导航栏示意">
      <div class="nav-icon" data-name="咨询端">咨</div>
      <div class="nav-icon active" data-name="学管中心">学</div>
      <div class="nav-icon" data-name="智能错题">错</div>
      <div class="nav-icon" data-name="账号管理">账</div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <h1>学管中心</h1>
          <p class="subtitle">班级管理草稿：顶部筛选、紧凑卡片、点击展开、超级管理员/负责人可见全量筛选。</p>
        </div>
        <div class="role-switch" aria-label="角色视角">
          <button class="active" data-role="admin">负责人视角</button>
          <button data-role="teacher">教师视角</button>
        </div>
      </header>

      <nav class="tabs" aria-label="学管中心主标签">
        <button class="tab active">班级管理</button>
        <button class="tab">学员管理</button>
      </nav>

      <section class="overview" aria-label="校区总览草稿">
        <p class="overview-kicker">Class Workspace</p>
        <div class="overview-head">
          <h2>校区总览</h2>
          <button class="info-mark" aria-label="校区总览说明">ⓘ</button>
          <div class="overview-filter-wrap" id="overviewFilterWrap">
            <button class="overview-filter-trigger" id="overviewFilterTrigger" type="button">
              全校区
            </button>
            <div class="cascade" id="overviewCascade" aria-label="校区总览筛选">
              <div class="cascade-col">
                <div class="cascade-options" id="overviewTypeOptions"></div>
              </div>
              <div class="cascade-col" id="overviewValueCol">
                <div class="cascade-options" id="overviewValueOptions"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="overview-stats">
          <div class="stat-card">
            <p class="stat-label" id="statTeachersLabel">教师人数</p>
            <p class="stat-value" id="statTeachers">0</p>
          </div>
          <div class="stat-card">
            <p class="stat-label">学员人数</p>
            <p class="stat-value" id="statStudents">0</p>
          </div>
          <div class="stat-card">
            <p class="stat-label">班级数量</p>
            <p class="stat-value" id="statClasses">0</p>
          </div>
          <div class="stat-card">
            <p class="stat-label">小课数量</p>
            <p class="stat-value" id="statLessons">0</p>
          </div>
        </div>
      </section>

      <section class="toolbar" aria-label="班级筛选">
        <div class="filter-row" id="filterRow"></div>
        <div class="popover" id="popover"></div>
      </section>

      <div class="summary-line">
        <span id="resultSummary">默认按年级从低到高排列</span>
        <span>编辑状态支持 <span class="kbd">Command</span> + <span class="kbd">S</span> 或 <span class="kbd">Ctrl</span> + <span class="kbd">S</span></span>
      </div>

      <section class="class-list" id="classList" aria-label="班级卡片列表"></section>
    </main>
  </div>

  <script>
    const classes = [
      { id: 1, subject: '数学', teacher: '曹老师', stage: '小奥', grade: '5年级', title: '2027级5年级1班', count: 18, lessons: 5, bridge: false, updated: '05-18', students: ['林明轩', '陈若曦', '王一诺', '李宇航', '周欣妍'] },
      { id: 2, subject: '国际数学', teacher: '陈老师', stage: '小奥', grade: '6年级', title: '2026级6年级2班·衔接', count: 15, lessons: 4, bridge: true, updated: '05-21', students: ['赵博文', '黄可欣', '吴雨桐', '徐浩然'] },
      { id: 3, subject: '数学', teacher: '曹老师', stage: '初中', grade: '7年级', title: '2025级7年级3班', count: 22, lessons: 6, bridge: false, updated: '05-22', students: ['孙嘉怡', '马诗涵', '朱俊豪', '何语晨', '高睿博'] },
      { id: 4, subject: '物理', teacher: '王老师', stage: '初中', grade: '8年级', title: '2024级8年级1班', count: 20, lessons: 5, bridge: false, updated: '05-23', students: ['梁子涵', '宋梓涵', '谢思源', '唐昊宇'] },
      { id: 5, subject: '物理', teacher: '李老师', stage: '初中', grade: '9年级', title: '2023级9年级4班·衔接', count: 16, lessons: 4, bridge: true, updated: '05-20', students: ['许可欣', '邓泽宇', '林明轩', '陈若曦'] },
      { id: 6, subject: '数学', teacher: '雷老师', stage: '高中', grade: '高一', title: '2025级高一2班', count: 19, lessons: 5, bridge: false, updated: '05-24', students: ['王一诺', '李宇航', '周欣妍', '赵博文'] },
      { id: 7, subject: '物理', teacher: '李老师', stage: '高中', grade: '高二', title: '2024级高二1班', count: 17, lessons: 4, bridge: false, updated: '05-19', students: ['黄可欣', '吴雨桐', '徐浩然', '孙嘉怡'] },
      { id: 8, subject: '国际数学', teacher: '周老师', stage: '高中', grade: '高三', title: '2023级高三3班', count: 12, lessons: 3, bridge: false, updated: '05-17', students: ['马诗涵', '朱俊豪', '何语晨'] }
    ];

    const gradeOrder = ['1年级', '2年级', '3年级', '4年级', '5年级', '6年级', '7年级', '8年级', '9年级', '高一', '高二', '高三'];
    const stageGrades = {
      '小奥': ['1年级', '2年级', '3年级', '4年级', '5年级', '6年级'],
      '初中': ['7年级', '8年级', '9年级'],
      '高中': ['高一', '高二', '高三']
    };
    const currentTeacher = '曹老师';
    const overviewLabels = {
      subject: '科目',
      teacher: '教师',
      stage: '学段',
      grade: '年级'
    };
    let overviewLayerCloseTimer = null;
    const state = {
      role: 'admin',
      active: 'subject',
      overviewOpen: false,
      overviewType: '',
      overviewPinnedType: '',
      overviewSelected: {
        subject: '',
        teacher: '',
        stage: '',
        grade: ''
      },
      selected: {
        subject: '',
        teacher: '',
        stage: '',
        grade: ''
      }
    };

    const labels = {
      subject: '科目',
      teacher: '教师',
      stage: '学段',
      grade: '年级'
    };

    function baseByRole() {
      if (state.role === 'teacher') {
        return classes.filter((item) => item.teacher === currentTeacher);
      }
      return classes;
    }

    function filteredExcept(exceptKey) {
      return baseByRole().filter((item) => {
        return Object.entries(state.selected).every(([key, value]) => {
          if (!value || key === exceptKey) return true;
          return item[key] === value;
        });
      });
    }

    function filteredClasses() {
      return baseByRole()
        .filter((item) => Object.entries(state.selected).every(([key, value]) => !value || item[key] === value))
        .sort((a, b) => gradeOrder.indexOf(a.grade) - gradeOrder.indexOf(b.grade) || a.title.localeCompare(b.title, 'zh-Hans-CN'));
    }

    function uniqueValues(items, key) {
      return Array.from(new Set(items.map((item) => item[key]).filter(Boolean)));
    }

    function overviewFilteredExcept(exceptKey) {
      return baseByRole().filter((item) => {
        return Object.entries(state.overviewSelected).every(([key, value]) => {
          if (!value || key === exceptKey) return true;
          return item[key] === value;
        });
      });
    }

    function overviewFilteredClasses() {
      return baseByRole().filter((item) => {
        return Object.entries(state.overviewSelected).every(([key, value]) => !value || item[key] === value);
      });
    }

    function overviewOptionsFor(key) {
      const source = overviewFilteredExcept(key);
      if (key === 'subject') return ['数学', '物理', '国际数学'];
      if (key === 'teacher') return uniqueValues(source, 'teacher');
      if (key === 'stage') return ['小奥', '初中', '高中'].filter((item) => uniqueValues(source, 'stage').includes(item));
      if (key === 'grade') {
        const available = new Set(uniqueValues(source, 'grade'));
        if (state.overviewSelected.stage && stageGrades[state.overviewSelected.stage]) {
          return stageGrades[state.overviewSelected.stage].filter((item) => available.has(item));
        }
        return gradeOrder.filter((item) => available.has(item));
      }
      return [];
    }

    function stabilizeOverviewSelections() {
      Object.keys(state.overviewSelected).forEach((key) => {
        const value = state.overviewSelected[key];
        if (!value) return;
        if (!overviewOptionsFor(key).includes(value)) {
          state.overviewSelected[key] = '';
        }
      });
    }

    function renderOverviewFilter() {
      const wrap = document.getElementById('overviewFilterWrap');
      const trigger = document.getElementById('overviewFilterTrigger');
      const cascade = document.getElementById('overviewCascade');
      const typeBox = document.getElementById('overviewTypeOptions');
      const valueCol = document.getElementById('overviewValueCol');
      const valueBox = document.getElementById('overviewValueOptions');
      const selectedText = Object.entries(state.overviewSelected)
        .filter(([, value]) => Boolean(value))
        .map(([key, value]) => overviewLabels[key] + '：' + value)
        .join(' / ');

      trigger.classList.toggle('active', state.overviewOpen);
      trigger.innerHTML = selectedText
        ? '全校区：' + selectedText + '<span class="x" id="overviewClear" role="button" tabindex="0" aria-label="清空校区总览筛选">x</span>'
        : '全校区';
      cascade.classList.toggle('open', state.overviewOpen);

      typeBox.innerHTML = Object.entries(overviewLabels).map(([key, label]) => {
        const active = state.overviewType === key ? ' active' : '';
        const selected = state.overviewSelected[key] ? ' selected' : '';
        return '<button class="cascade-option' + active + selected + '" data-overview-type="' + key + '">' + label + '</button>';
      }).join('');

      const renderOverviewValueLayer = () => {
        typeBox.querySelectorAll('[data-overview-type]').forEach((button) => {
          const key = button.dataset.overviewType;
          button.classList.toggle('active', state.overviewType === key);
          button.classList.toggle('selected', Boolean(state.overviewSelected[key]));
        });
        valueCol.style.display = state.overviewType ? '' : 'none';
        const options = state.overviewType ? overviewOptionsFor(state.overviewType) : [];
        valueBox.innerHTML = options.length
          ? options.map((option) => {
            const selected = state.overviewSelected[state.overviewType] === option ? ' selected' : '';
            return '<button class="cascade-option' + selected + '" data-overview-value="' + option + '">' + option + '</button>';
          }).join('')
          : '<span class="summary-line">当前条件下暂无可选项。</span>';
        valueBox.querySelectorAll('[data-overview-value]').forEach((button) => {
          button.onclick = () => {
            state.overviewSelected[state.overviewType] = button.dataset.overviewValue;
            stabilizeOverviewSelections();
            state.overviewOpen = true;
            render();
          };
        });
      };
      renderOverviewValueLayer();

      wrap.onmouseenter = () => {
        if (state.overviewOpen) return;
        state.overviewOpen = true;
        render();
      };
      wrap.onmouseleave = () => {
        state.overviewOpen = false;
        state.overviewType = '';
        state.overviewPinnedType = '';
        render();
      };
      trigger.onclick = (event) => {
        event.stopPropagation();
        state.overviewOpen = !state.overviewOpen;
        if (!state.overviewOpen) {
          state.overviewType = '';
          state.overviewPinnedType = '';
        }
        render();
      };
      const clear = document.getElementById('overviewClear');
      if (clear) {
        clear.onclick = (event) => {
          event.stopPropagation();
          state.overviewSelected = { subject: '', teacher: '', stage: '', grade: '' };
          state.overviewType = '';
          state.overviewPinnedType = '';
          render();
        };
      }
      typeBox.querySelectorAll('[data-overview-type]').forEach((button) => {
        button.onmouseenter = () => {
          if (overviewLayerCloseTimer) {
            clearTimeout(overviewLayerCloseTimer);
            overviewLayerCloseTimer = null;
          }
          state.overviewType = button.dataset.overviewType;
          state.overviewPinnedType = '';
          state.overviewOpen = true;
          renderOverviewValueLayer();
        };
        button.onmouseleave = () => {
          if (overviewLayerCloseTimer) clearTimeout(overviewLayerCloseTimer);
          overviewLayerCloseTimer = setTimeout(() => {
            state.overviewType = '';
            state.overviewPinnedType = '';
            renderOverviewValueLayer();
            overviewLayerCloseTimer = null;
          }, 120);
        };
        button.onclick = () => {
          if (overviewLayerCloseTimer) {
            clearTimeout(overviewLayerCloseTimer);
            overviewLayerCloseTimer = null;
          }
          if (state.overviewType === button.dataset.overviewType) {
            state.overviewType = '';
            state.overviewPinnedType = '';
          } else {
            state.overviewType = button.dataset.overviewType;
            state.overviewPinnedType = button.dataset.overviewType;
          }
          state.overviewOpen = true;
          renderOverviewValueLayer();
        };
      });
      valueCol.onmouseenter = () => {
        if (overviewLayerCloseTimer) {
          clearTimeout(overviewLayerCloseTimer);
          overviewLayerCloseTimer = null;
        }
      };
      valueCol.onmouseleave = () => {
        if (overviewLayerCloseTimer) clearTimeout(overviewLayerCloseTimer);
        overviewLayerCloseTimer = setTimeout(() => {
          state.overviewType = '';
          state.overviewPinnedType = '';
          renderOverviewValueLayer();
          overviewLayerCloseTimer = null;
        }, 120);
      };
    }

    function renderOverviewStats() {
      const items = overviewFilteredClasses();
      const teachers = uniqueValues(items, 'teacher').length;
      const students = items.reduce((sum, item) => sum + item.count, 0);
      const lessons = items.reduce((sum, item) => sum + item.lessons, 0);
      document.getElementById('statTeachersLabel').textContent = state.role === 'teacher' ? '主讲教师' : '教师人数';
      document.getElementById('statTeachers').textContent = state.role === 'teacher' ? currentTeacher : teachers;
      document.getElementById('statStudents').textContent = students;
      document.getElementById('statClasses').textContent = items.length;
      document.getElementById('statLessons').textContent = lessons;
    }

    function optionsFor(key) {
      const source = filteredExcept(key);
      if (key === 'subject') return ['数学', '物理', '国际数学'].filter((item) => uniqueValues(source, 'subject').includes(item));
      if (key === 'teacher') return uniqueValues(source, 'teacher');
      if (key === 'stage') return ['小奥', '初中', '高中'].filter((item) => uniqueValues(source, 'stage').includes(item));
      if (key === 'grade') {
        const available = new Set(uniqueValues(source, 'grade'));
        if (state.selected.stage && stageGrades[state.selected.stage]) {
          return stageGrades[state.selected.stage].filter((item) => available.has(item));
        }
        return gradeOrder.filter((item) => available.has(item));
      }
      return [];
    }

    function stabilizeSelections() {
      Object.keys(state.selected).forEach((key) => {
        const value = state.selected[key];
        if (!value) return;
        if (!optionsFor(key).includes(value)) {
          state.selected[key] = '';
        }
      });
    }

    function renderFilters() {
      const row = document.getElementById('filterRow');
      const keys = state.role === 'teacher' ? ['subject', 'stage', 'grade'] : ['subject', 'teacher', 'stage', 'grade'];
      row.innerHTML = keys.map((key) => {
        const selected = state.selected[key];
        const text = selected || labels[key];
        const selectedClass = selected ? 'selected' : '';
        const activeClass = state.active === key ? 'active' : '';
        const close = selected ? '<button class="x" data-clear="' + key + '" aria-label="取消' + labels[key] + '">x</button>' : '';
        return '<div class="filter-label ' + selectedClass + ' ' + activeClass + '" role="button" tabindex="0" data-filter="' + key + '">' + text + close + '</div>';
      }).join('') + '<span class="filter-meta">' + (state.role === 'teacher' ? '教师视角：只显示本人班级' : '负责人视角：可查看全机构班级') + '</span>';

      row.querySelectorAll('[data-filter]').forEach((button) => {
        button.addEventListener('mouseenter', () => {
          state.active = button.dataset.filter;
          render();
        });
        button.addEventListener('click', () => {
          state.active = button.dataset.filter;
          render();
        });
        button.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            state.active = button.dataset.filter;
            render();
          }
        });
      });
      row.querySelectorAll('[data-clear]').forEach((button) => {
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          state.selected[button.dataset.clear] = '';
          stabilizeSelections();
          render();
        });
      });
    }

    function renderPopover() {
      const popover = document.getElementById('popover');
      const options = optionsFor(state.active);
      popover.innerHTML = '<p class="popover-title">' + labels[state.active] + '筛选</p>' +
        '<div class="option-grid">' +
        options.map((option) => {
          const selectedClass = state.selected[state.active] === option ? ' selected' : '';
          return '<button class="option' + selectedClass + '" data-option="' + option + '">' + option + '</button>';
        }).join('') +
        '</div>';
      popover.querySelectorAll('[data-option]').forEach((button) => {
        button.addEventListener('click', () => {
          state.selected[state.active] = button.dataset.option;
          stabilizeSelections();
          render();
        });
      });
    }

    function renderCards() {
      const list = document.getElementById('classList');
      const items = filteredClasses();
      document.getElementById('resultSummary').textContent = '共 ' + items.length + ' 个班级，默认按年级从低到高排列';
      list.innerHTML = items.map((item, index) => {
        const tag = item.bridge ? '<span class="tag amber">衔接</span>' : '<span class="tag green">常规</span>';
        return '<article class="class-card ' + (index === 0 ? 'open' : '') + '">' +
          '<div class="class-head">' +
            '<div class="class-main">' +
              '<h2>' + item.title + '</h2>' +
              '<div class="class-sub"><span>' + item.subject + '</span><span class="dot"></span><span>' + item.stage + '</span><span class="dot"></span><span>' + item.count + '人</span>' + tag + '</div>' +
            '</div>' +
            '<div class="field-grid">' +
              '<div><div class="field-label">上课教师</div><div class="field-value">' + item.teacher + '</div></div>' +
              '<div><div class="field-label">当前年级</div><div class="field-value">' + item.grade + '</div></div>' +
              '<div><div class="field-label">最近变更</div><div class="field-value">' + item.updated + '</div></div>' +
            '</div>' +
            '<div class="actions">' +
              '<button class="text-button primary">编辑</button>' +
              '<button class="text-button">学员</button>' +
              '<button class="icon-button" aria-label="历史">H</button>' +
            '</div>' +
          '</div>' +
          '<div class="class-detail">' +
            '<div class="detail-box"><h3>班级学员</h3><div class="student-pills">' + item.students.map((student) => '<span>' + student + '</span>').join('') + '<span>+' + Math.max(item.count - item.students.length, 0) + '</span></div></div>' +
            '<div class="detail-box"><h3>历史记录</h3><ul class="timeline"><li><strong>' + item.updated + '</strong> 更新班级信息</li><li><strong>04-30</strong> 调整学员进出记录</li><li><strong>03-01</strong> 创建或升级班级</li></ul></div>' +
          '</div>' +
        '</article>';
      }).join('');
      list.querySelectorAll('.class-head').forEach((head) => {
        head.addEventListener('click', (event) => {
          if (event.target.closest('button')) return;
          head.closest('.class-card').classList.toggle('open');
        });
      });
    }

    function renderRoleSwitch() {
      document.querySelectorAll('[data-role]').forEach((button) => {
        button.classList.toggle('active', button.dataset.role === state.role);
        button.onclick = () => {
          state.role = button.dataset.role;
          if (state.role === 'teacher') {
            state.selected.teacher = '';
            state.overviewSelected.teacher = '';
            if (state.active === 'teacher') state.active = 'subject';
            if (state.overviewType === 'teacher') state.overviewType = '';
            if (state.overviewPinnedType === 'teacher') state.overviewPinnedType = '';
          }
          stabilizeSelections();
          stabilizeOverviewSelections();
          render();
        };
      });
    }

    function render() {
      stabilizeSelections();
      stabilizeOverviewSelections();
      renderRoleSwitch();
      renderOverviewFilter();
      renderOverviewStats();
      renderFilters();
      renderPopover();
      renderCards();
    }

    document.addEventListener('keydown', (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 's') {
        event.preventDefault();
        alert('草稿示意：保存班级编辑');
      }
    });

    render();
  </script>
</body>
</html>
