{% extends "base.html" %}
{% block title %}添加课程{% endblock %}

{% block content %}
<div class="row justify-content-center mt-2">
  <div class="col-xl-8 col-lg-9">
    <div class="card">
      <div class="card-header fw-bold">
        <i class="bi bi-plus-circle text-primary"></i>
        {% if cls %}
          为「{{ cls.name }}」添加本节课
          <a href="{{ url_for('class_detail', class_id=cls.id) }}" class="btn btn-sm btn-outline-secondary ms-2">
            <i class="bi bi-arrow-left"></i> 返回班级
          </a>
        {% else %}
          添加新课程
        {% endif %}
      </div>
      <div class="card-body">

        <form method="POST" enctype="multipart/form-data" id="addForm">
          <input type="hidden" name="class_id" value="{{ class_id or 0 }}">

          {% if not cls %}
          <!-- 独立添加时可选择班级 -->
          <div class="mb-3">
            <label class="form-label fw-semibold">选择班级（可选）</label>
            <select class="form-select" name="class_id_select" id="classSel"
                    onchange="applyClass(this.value)">
              <option value="">-- 不绑定班级 --</option>
              {% for c in classes %}
              <option value="{{ c.id }}"
                      data-subject="{{ c.subject }}"
                      data-grade="{{ c.grade }}"
                      {% if class_id == c.id %}selected{% endif %}>
                {{ c.name }}（{{ c.grade }}{{ c.subject }}）
              </option>
              {% endfor %}
            </select>
          </div>
          {% endif %}

          <!-- 课程元信息 -->
          <div class="row g-3 mb-4">
            <div class="col-md-3">
              <label class="form-label fw-semibold">
                科目 <span class="text-danger">*</span>
              </label>
              <input type="text" class="form-control" name="subject" id="fSubject"
                     placeholder="如：数学"
                     value="{{ form.subject if form else (cls.subject if cls else '') }}"
                     {% if cls %}readonly{% endif %} required>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">年级</label>
              <input type="text" class="form-control" name="grade" id="fGrade"
                     placeholder="如：初二"
                     value="{{ form.grade if form else (cls.grade if cls else '') }}"
                     {% if cls %}readonly{% endif %}>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">本节课主题</label>
              <input type="text" class="form-control" name="topic"
                     placeholder="如：二次函数图像"
                     value="{{ form.topic if form else '' }}">
            </div>
            <div class="col-md-2">
              <label class="form-label fw-semibold">日期</label>
              <input type="date" class="form-control" name="date"
                     value="{{ today }}">
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">学生薄弱点（可选）</label>
            <input type="text" class="form-control" name="weak_points"
                   placeholder="如：顶点公式记错、忘记讨论 a 的正负">
          </div>

          <!-- 内容选项卡 -->
          <div class="mb-4">
            <label class="form-label fw-semibold mb-2">
              课堂内容 <span class="text-danger">*</span>
            </label>

            <ul class="nav nav-pills mb-3" id="inputTabs">
              <li class="nav-item">
                <button class="nav-link active" type="button" data-tab="text">
                  <i class="bi bi-textarea-t"></i> 粘贴文字总结
                </button>
              </li>
              <li class="nav-item ms-2">
                <button class="nav-link" type="button" data-tab="file">
                  <i class="bi bi-upload"></i> 上传文件 / 录音
                </button>
              </li>
            </ul>

            <input type="hidden" name="input_type" id="inputType" value="text">

            <!-- 文字输入 -->
            <div id="tabText">
              <textarea class="form-control font-monospace" name="summary_text"
                        rows="14"
                        style="font-size:.9rem;line-height:1.7"
                        placeholder="请粘贴课堂总结内容&#10;&#10;推荐格式（也支持自由格式）：&#10;科目：数学&#10;年级：初二&#10;本节课主题：二次函数&#10;课堂总结：&#10;  本节讲了 y=ax²+bx+c 的开口方向……&#10;学生薄弱点：&#10;  顶点公式记错，a 的符号常搞混"></textarea>
            </div>

            <!-- 文件上传 -->
            <div id="tabFile" style="display:none">
              <div class="border rounded p-4 text-center bg-light" id="dropZone">
                <i class="bi bi-cloud-upload fs-1 text-secondary"></i>
                <div class="mt-2 fw-semibold">选择文件</div>
                <div class="text-muted small mt-1">
                  文字总结：<code>.txt</code> / <code>.md</code><br>
                  课堂录音：<code>.mp3</code> / <code>.m4a</code> /
                  <code>.wav</code> / <code>.mp4</code>（最大 25 MB）
                </div>
                <input type="file" class="form-control mt-3" name="upload_file"
                       id="fileInput"
                       accept=".txt,.md,.mp3,.m4a,.wav,.mp4,.ogg,.webm,.flac">
                <div id="selectedFile" class="mt-2 text-primary small d-none"></div>
              </div>
            </div>
          </div>

          <!-- 复习风格选择 -->
          <div class="mb-4">
            <label class="form-label fw-semibold">
              <i class="bi bi-stars text-warning"></i> 复习讲义风格
              <span class="text-muted fw-normal small ms-1">（可多选，不选则使用标准填空）</span>
            </label>
            <div class="row g-2">

              <div class="col-md-6">
                <label class="d-flex align-items-start gap-2 border rounded p-3 style-card" style="cursor:pointer">
                  <input class="form-check-input mt-1 flex-shrink-0" type="checkbox" name="prompt_styles" value="B">
                  <div>
                    <div class="fw-semibold">🔍 三问法</div>
                    <div class="text-muted small">每条知识点拆成：是什么 / 为什么 / 怎么用，逼出真理解</div>
                  </div>
                </label>
              </div>

              <div class="col-md-6">
                <label class="d-flex align-items-start gap-2 border rounded p-3 style-card" style="cursor:pointer">
                  <input class="form-check-input mt-1 flex-shrink-0" type="checkbox" name="prompt_styles" value="C">
                  <div>
                    <div class="fw-semibold">📝 考题格式</div>
                    <div class="text-muted small">每天对应一种题型的解题框架，直接贴近考试实战</div>
                  </div>
                </label>
              </div>

              <div class="col-md-6">
                <label class="d-flex align-items-start gap-2 border rounded p-3 style-card" style="cursor:pointer">
                  <input class="form-check-input mt-1 flex-shrink-0" type="checkbox" name="prompt_styles" value="D">
                  <div>
                    <div class="fw-semibold">💬 对话自测</div>
                    <div class="text-muted small">模拟老师连续提问，学生用对话链形式完成答题</div>
                  </div>
                </label>
              </div>

              <div class="col-md-6">
                <label class="d-flex align-items-start gap-2 border rounded p-3 style-card" style="cursor:pointer">
                  <input class="form-check-input mt-1 flex-shrink-0" type="checkbox" name="prompt_styles" value="E">
                  <div>
                    <div class="fw-semibold">☑️ 遗忘清单</div>
                    <div class="text-muted small">每天3-5条核查项，☐ 逐条勾选，5秒快速自检</div>
                  </div>
                </label>
              </div>

            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100" id="submitBtn">
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// ── 风格卡片选中高亮 ────────────────────────────────────────
document.querySelectorAll('.style-card input[type="checkbox"]').forEach(cb => {
  cb.addEventListener('change', function () {
    this.closest('.style-card').classList.toggle('border-primary', this.checked);
    this.closest('.style-card').classList.toggle('bg-primary', this.checked);
    this.closest('.style-card').classList.toggle('bg-opacity-10', this.checked);
  });
});

// ── 班级自动填充 ────────────────────────────────────────────
function applyClass(id) {
  const sel = document.getElementById('classSel');
  if (!sel) return;
  const opt = sel.querySelector(`option[value="${id}"]`);
  document.getElementById('fSubject').value = opt ? (opt.dataset.subject || '') : '';
  document.getElementById('fGrade').value   = opt ? (opt.dataset.grade   || '') : '';
  // sync hidden field
  document.querySelector('input[name="class_id"]').value = id || 0;
}

// ── 选项卡切换 ──────────────────────────────────────────────
document.querySelectorAll('[data-tab]').forEach(btn => {
  btn.addEventListener('click', function () {
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    const tab = this.dataset.tab;
    document.getElementById('inputType').value = tab;
    document.getElementById('tabText').style.display = tab === 'text' ? '' : 'none';
    document.getElementById('tabFile').style.display = tab === 'file' ? '' : 'none';
  });
});

// ── 文件选择显示 ────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', function () {
  const f = this.files[0];
  if (!f) return;
  const audioExts = ['.mp3', '.m4a', '.wav', '.mp4', '.ogg', '.webm', '.flac'];
  const isAudio = audioExts.some(e => f.name.toLowerCase().endsWith(e));
  const el = document.getElementById('selectedFile');
  el.textContent = `已选择：${f.name}` + (isAudio ? '（音频，将自动转录）' : '');
  el.classList.remove('d-none');
});

// ── 提交时显示 Loading ──────────────────────────────────────
document.getElementById('addForm').addEventListener('submit', function () {
  const inputType = document.getElementById('inputType').value;
  let msg = 'AI 正在生成复习计划，请稍候（30–60 秒）…';
  if (inputType === 'file') {
    const f = document.getElementById('fileInput').files[0];
    const audioExts = ['.mp3', '.m4a', '.wav', '.mp4', '.ogg', '.webm', '.flac'];
    if (f && audioExts.some(e => f.name.toLowerCase().endsWith(e))) {
      msg = '正在转录录音 + AI 生成复习计划，请稍候（1–2 分钟）…';
    }
  }
  showLoading(msg);
});
</script>
{% endblock %}
