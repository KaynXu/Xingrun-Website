subject: ielts
source_notes:
  - 当前桌面资料主要覆盖 IELTS Reading
  - Listening/Writing/Speaking 是 Phase 2 扩展，不假装已有完整规则
core_dimensions:
  - reading
  - listening
  - writing_task_1
  - writing_task_2
  - speaking
  - vocabulary
  - grammar
  - feedback_loop
planning_principles:
  - Reading 重点是题型流程、定位、同义替换和错因分类
  - 雅思阅读复习不是背文章内容，而是把课堂带做过程转成可迁移做题流程
  - 每一天填空题都尽量覆盖整节阅读课完整主线，不能只考当天主题
  - Writing 必须包含写作、批改、重写
  - Speaking 必须包含录音、反馈、复述或二次回答
  - Reading 和 Listening 必须做错因分类
  - 每周或阶段必须有 feedback loop
required_components:
  - band_gap_analysis
  - skill_drill
  - vocabulary_review
  - timed_practice
  - mock_test
  - feedback
  - rewrite_or_retake
  - error_type_analysis
reading_rules:
  - 每个复习日尽量覆盖整节阅读课的完整主线
  - 填空题围绕题型判断、关键词定位、词性、同义替换和判断题边界
  - 选择题只做基础记忆、易混辨析和错误纠正
  - 每个复习日填空题建议 6-8 题
  - 每天尽量覆盖题型扫描与做题顺序、填空题逻辑、人名匹配、信息匹配、判断题、易混词与错题复盘
  - 填空题以做题策略为主，不背文章事实细节
  - 课堂原话只保留老师总结做题策略、纠正常见误区、提醒限时阅读心态的话
reading_day_focus:
  day_1: 流程回忆，建立题型扫描和做题顺序
  day_2: 逻辑信号，强化填空题、词性、并列、否定、转折和同义替换
  day_7: 匹配题迁移，强化人名匹配、信息匹配、statement 归属和段落信息方向
  day_14: 判断题与词汇校准，减少 False/Not Given、易混词和逻辑误判
  day_30: 限时综合复盘，检查题型流程是否稳定
reading_strategy_items:
  - 开做前先扫题型，再决定读题顺序
  - 填空题先判断词性、逻辑词、并列、否定、转折、known as/called
  - 人名匹配先扫人名、引号和关键词，判断 statement 归属
  - 信息匹配要预判例子、失败、未来、工具限制、责任感等方向
  - 判断题必须区分 True、False、Not Given，不能靠常识补充
  - 限时训练后错题按词汇、定位、逻辑三类归因
choice_rules:
  - 不把选择题做成文章内容记忆题
  - 优先考题型策略选择、易混概念辨析、常见错误纠正
  - 推荐围绕人名匹配、known as、Not Given、限时复盘方式设计
transcript_extraction_steps:
  - 识别本节课练了哪些题型
  - 提炼每种题型的做题顺序
  - 记录老师反复强调的定位方法
  - 收集学生暴露出的易混词和误判点
  - 提炼少量高价值课堂原话
  - 整理本节课必须长期记住的做题动作
avoid:
  - 只让学生刷真题
  - 忽略输出型任务
  - 忽略 band descriptor
  - 没有 rewrite 或 retell
  - 四项技能混在一起不区分
  - 只背阅读文章内容
  - 每天只考单一题型
  - 忽略 False 和 Not Given 边界
  - 忽略词汇、定位、逻辑三类错因
