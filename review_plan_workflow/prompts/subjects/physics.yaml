subject: physics
source_notes:
  - 物理工作流是统一视觉样式蓝本
  - 物理特有内容留在 subject pack，视觉规则抽入统一 style
core_dimensions:
  - concept
  - law
  - formula
  - unit
  - graph
  - experiment
  - calculation
  - explanation
planning_principles:
  - 前三次可分模块复习，第14/30天累积复习前三次内容
  - 第1天复习第1个核心模块，第2天复习第2个核心模块，第7天复习第3个核心模块
  - 第14天和第30天只回收第1/2/7天内容，不引入新知识点
  - 第14天偏口述追问和错因校准，第30天偏落笔自测和长期记忆检查
  - 先理解概念和适用条件，再进行计算训练
  - 公式必须和单位、图像、实验情境绑定
  - 错题分析区分概念错误、公式选择错误、单位错误、图像理解错误、计算错误
  - 训练必须包含文字解释题，不能只做计算题
  - 每个复习日覆盖概念判断、公式选择、单位统一、代入计算、结果解释这条完整链路
  - 选择题后固定加入主动回忆栏目，Day1/7/30 用“课堂方法回溯”，Day2/14 用“老师追问口述卡片”
required_components:
  - concept_map
  - formula_sheet
  - unit_check
  - graph_interpretation
  - experiment_analysis
  - calculation_drill
  - explanation_practice
  - error_analysis
quality_rules:
  - 公式必须包含适用条件和物理量含义
  - 必须有单位检查和数量级判断
  - 必须有实验或数据处理任务
  - 不把物理变成纯数学计算训练
  - 填空题必须有上下文指向，不强行挖课堂原话
  - 选择题答案分布要混合，干扰项来自真实物理误区
  - 老师追问卡片必须要求学生说明为什么用这个公式而不是相近公式
  - 引用课堂原题必须给题干；题干不足时改为同类题背景
formula_rules:
  - 每个核心公式首次出现时写成“公式 + 物理量含义 + 常用单位 + 适用条件”
  - 公式优先使用 PDF 稳定显示的普通文本形式，例如 v=s/t、F=ma、p=F/S、P=W/t、Q=cm·Δt、U=IR、P=UI
  - 乘法优先用点乘 ·，面积和体积可写 m²、m³；显示不稳时写 m^2、m^3
  - 下标优先写清楚，例如 rho液、V排、p0、U总、R1、R2
  - 正式公式卡和背景公式中的分式优先渲染为上下分式；正文行内解释可保留一行形式
  - 矢量和方向相关内容必须写清方向，不能只写大小
  - 含正负号公式必须说明正方向或能量增减意义
  - 涉及近似条件必须写清 g≈9.8N/kg、g取10N/kg、光滑、轻绳、忽略空气阻力等条件
  - 区分相近公式：G=mg 与万有引力、p=F/S 与 p=rho·g·h、P=W/t 与 P=UI、Q=cm·Δt 与 Q=mq
transcript_cleanup_rules:
  - 录音里的“密度、肉、rou、ρ”统一整理为 rho，必要时备注 rho 表示密度
  - “德尔塔t、温度差、升高多少度”统一整理为 Δt
  - 伏安法、欧姆定律、电功率必须区分 U=IR、P=UI、W=UIt、Q=I²Rt
  - 压强必须先判断固体压强 p=F/S 还是液体压强 p=rho液·g·h
  - 浮力必须明确称重法 F浮=G-F示、阿基米德原理 F浮=rho液·g·V排、漂浮/悬浮 F浮=G
  - 口误、错读单位、不完整公式必须先按教材常用表述校正再入题
daily_focus:
  day_1: 本课框架、概念起点或第一组方法
  day_2: 对比、实验、第二组方法或易混点
  day_7: 公式计算、迁移应用、综合题或最后一组方法
  day_14: 累积回收前三次内容，做口述追问和错因校准
  day_30: 累积回收前三次内容，做落笔自测和长期记忆检查
motivational_column:
  title: 物理里的远方
  rules:
    - 替代大量课堂原话回放
    - 内容使用学生励志、学习哲思和物理相关短句
    - 语气克制、清醒、有力量，不写空泛鸡汤
    - 只作轻量精神提醒，不能抢占主体复习内容
avoid:
  - 只背公式
  - 忽略实验设计和误差分析
  - 忽略单位和数量级判断
  - 忽略文字解释题
  - 与本课无关的通用公式背景
  - 未清洗的录音识别噪声
  - 脱离题干的“为什么用欧姆定律”式追问
