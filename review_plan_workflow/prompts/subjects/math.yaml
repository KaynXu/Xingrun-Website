subject: math
source_notes:
  - 崔老师版本保留题目质量、公式、口述卡片和出品检查优势
  - 华老师版本保留稳定 5 天结构、通用版式和分页规则优势
core_dimensions:
  - topic
  - skill
  - question_type
  - error_pattern
  - method
  - exam_strategy
planning_principles:
  - 每个复习日都覆盖整节课，但侧重点不同
  - 第1天和第2天使用填空+选择混合题建立整课框架
  - 第7天和第14天使用老师追问口述卡片检查方法链
  - 第30天回到落笔自测，使用填空+选择混合题做长期检查
  - 先诊断概念漏洞，再安排题型训练
  - 每个 topic 应对应至少一种可作答题型
  - 高频错因要分类，例如审题、代数变形、公式误用、图像理解、步骤缺失
  - 必须安排 spiral review、timed practice 或 checkpoint quiz
  - 第2天起不重复全课覆盖清单和执行清单，避免空框和大段空白
quality_rules:
  - 填空题答案必须具体、可推断
  - 不使用斜杠纯文本替代分式
  - 角和三角形对象使用 ∠ 与 △ 等数学符号
  - 老师追问必须有完整题干或同类题背景
  - 不输出口号式挖空或低质量孤立工具题
  - 不把“方法、入口、边界、条件、过程、动作、提醒”等抽象词作为主要设空答案
  - 不出现“某题”“这个题”“第23题”等学生无法独立作答的引用
  - 同一天的填空题、选择题、老师追问不能反复考同一个基础点
  - 第30天不能退回抽象口令，必须出综合迁移小题
  - 选择题干扰项必须像真实数学错误，答案分布不能全部集中在同一选项
formula_rules:
  - 分式、根式、指数、上下标、方程组必须用可打印的数学表达，不退化成中文长分数
  - 三角形写作 △ABC，不写“ 三角形ABC ”
  - 具体角名写作 ∠CFE、∠FEG=∠FDA，不写“角CFE”
  - PDF 生成器不能稳定公式对象时，优先改成整数友好的同类题，不能用汉字化数式绕开
problem_stem_rules:
  - 引用课堂原题必须补足必要条件
  - 题干信息不完整时改写成同类题背景
  - 填空题必须能根据局部条件推出答案
  - 工具题要放入翻折、建系、中垂线、夹角公式、相似转化等完整背景
oral_card_rules:
  - 老师追问卡片必须有完整题干或同类题背景
  - 题干、问、问题、提问后不要直接接英文字母或变量名，避免 PDF 截断
  - 优先使用“题干：点E在……。问：……”这类中文开头结构
  - 第7天、第14天老师追问口述卡片总数不要超过3问
  - 空题干、只剩标题、只问抽象模型理由的卡片必须重写
required_components:
  - topic_review
  - worked_example
  - targeted_practice
  - error_log
  - timed_practice
  - spiral_review
  - checkpoint_quiz
avoid:
  - 只写刷题
  - 只按章节罗列
  - 忽略错题归因
  - 忽略解题步骤
  - 没有回炉机制
  - 口号式填空
  - 中文长分数
  - 一眼假的选择题
  - 过浅孤立工具题
